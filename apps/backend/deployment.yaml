apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-backend
  namespace: ecom

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ecom-backend

  template:
    metadata:
      labels:
        app: ecom-backend

    spec:
      containers:
        - name: ecom-backend
          image: mendax1/e-comback:latest

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

            - name: DB_HOST
              value: ecom-mysql

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: ecom

            - name: DB_USERNAME
              value: ecom

            - name: DB_PASSWORD
              value: ecom
