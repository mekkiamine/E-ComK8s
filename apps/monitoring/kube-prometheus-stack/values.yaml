# --- Prometheus ----------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 24h
    retentionSize: 3GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 3Gi
    # Scrape ALL ServiceMonitors/PodMonitors anywhere in the cluster
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

# --- Alertmanager --------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - alertname =~ "InfoInhibitor|Watchdog"
          receiver: "null"
    receivers:
      - name: "null"
    # ─── To enable Slack notifications later, replace the block above with:
    #
    # global:
    #   slack_api_url: <YOUR_SLACK_WEBHOOK>
    # route:
    #   receiver: slack
    #   group_by: [alertname, namespace]
    #   routes:
    #     - matchers: [{alertname =~ "InfoInhibitor|Watchdog"}]
    #       receiver: "null"
    # receivers:
    #   - name: "null"
    #   - name: slack
    #     slack_configs:
    #       - channel: "#alerts"
    #         send_resolved: true
    #         title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
    #         text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'

# --- Grafana -------------------------------------------------------------
grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.ecom.local
    path: /
    pathType: Prefix

  # Pre-wire Loki datasource; Prometheus datasource is created automatically
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      isDefault: true
      jsonData:
        timeInterval: 30s
        httpMethod: POST
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
      isDefault: false

  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: false

# --- Operator + infra ---------------------------------------------------
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# --- Disable components that need extra setup / don't work on this cluster
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
