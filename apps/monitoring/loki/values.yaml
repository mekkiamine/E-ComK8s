deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
  ruler:
    enable_api: true
    storage:
      type: local
      local:
        directory: /rules
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: longhorn
    accessModes: ["ReadWriteOnce"]
    size: 3Gi

# Disable microservice-mode deployments
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Disable caches and extras
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Gateway fronts Loki so Grafana datasource URL stays stable
gateway:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: true
