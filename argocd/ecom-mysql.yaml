apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-mysql
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mekkiamine/E-ComK8s.git
    targetRevision: main
    path: apps/mysql

  destination:
    server: https://kubernetes.default.svc
    namespace: ecom

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
