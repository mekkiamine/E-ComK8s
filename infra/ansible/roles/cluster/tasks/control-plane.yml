---
- name: Check whether Kubernetes is already initialized
  ansible.builtin.stat:
    path: "{{ kubeconfig_path }}"
  register: kubeadm_admin_conf

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --apiserver-advertise-address={{ ansible_host }}
      --control-plane-endpoint={{ control_plane_endpoint }}
      --pod-network-cidr={{ pod_network_cidr }}
      --service-cidr={{ service_network_cidr }}
      --cri-socket={{ kubeadm_cri_socket }}
  when: not kubeadm_admin_conf.stat.exists

- name: Ensure kubeconfig directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy admin kubeconfig for Kubernetes user
  ansible.builtin.copy:
    src: "{{ kubeconfig_path }}"
    dest: "{{ user_kubeconfig_path }}"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Wait for Kubernetes API server
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 6443
    delay: 5
    timeout: 120

- name: Install Flannel CNI
  ansible.builtin.command:
    cmd: >
      kubectl
      --kubeconfig={{ kubeconfig_path }}
      apply
      -f
      {{ flannel_manifest_url }}
  register: flannel_apply
  changed_when: >
    'created' in flannel_apply.stdout or
    'configured' in flannel_apply.stdout or
    'patched' in flannel_apply.stdout

- name: Wait for Flannel DaemonSet
  ansible.builtin.command:
    cmd: >
      kubectl
      --kubeconfig={{ kubeconfig_path }}
      rollout status
      daemonset/kube-flannel-ds
      -n kube-flannel
      --timeout=180s
  changed_when: false

