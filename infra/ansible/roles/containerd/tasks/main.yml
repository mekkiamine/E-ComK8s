---
- name: Ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  get_url:
    url: "{{ docker_apt_key_url }}"
    dest: /etc/apt/keyrings/docker.gpg
    mode: "0644"
    force: false

- name: Add Docker apt repository
  apt_repository:
    repo: "{{ docker_apt_repo }}"
    filename: docker
    state: present
    update_cache: true

- name: Install containerd
  apt:
    name: "containerd.io={{ containerd_version }}"
    state: present
    allow_downgrade: true
  notify: restart containerd

- name: Ensure containerd config directory exists
  file:
    path: "{{ containerd_config_dir }}"
    state: directory
    mode: "0755"

- name: Render containerd config with SystemdCgroup enabled
  template:
    src: config.toml.j2
    dest: "{{ containerd_config_dir }}/config.toml"
    mode: "0644"
  notify: restart containerd

- name: Enable and start containerd
  service:
    name: containerd
    state: started
    enabled: true

- name: Install crictl
  unarchive:
    src: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
    creates: /usr/local/bin/crictl

- name: Configure crictl to use containerd socket
  copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
      debug: false
    mode: "0644"
