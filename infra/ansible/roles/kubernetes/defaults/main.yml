---
kubernetes_version: "1.37"

kubernetes_apt_key_url: "https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key"
kubernetes_apt_keyring: "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"

kubernetes_apt_repo: "deb [signed-by={{ kubernetes_apt_keyring }}] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /"

kubernetes_packages:
  - kubelet
  - kubeadm
  - kubectl
